services:
  ai-agent:
    build:
      context: ./ai-agent-project
      dockerfile: Dockerfile
    container_name: ai-agent
    restart: unless-stopped
    env_file:
      - ./ai-agent-project/.env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
    depends_on:
      - wazuh.indexer
